[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-local-sync"
version = "0.3.0"
description = "Sync Garmin activity and health data into a local GeoPackage with faithful geography"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Emmanuel Belo"}]
dependencies = ["requests>=2.33,<3", "fitdecode>=0.10,<1", "defusedxml>=0.7.1,<1"]
keywords = ["garmin", "geopackage", "fitness", "geospatial", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Repository = "https://github.com/ebelo/garmin-local-sync"
Issues = "https://github.com/ebelo/garmin-local-sync/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1.2,<2",
  "mypy>=1.15,<2", "types-requests>=2.31,<3", "types-defusedxml>=0.7,<1",
  "bandit>=1.8,<2", "detect-secrets>=1.5,<2", "pip-audit>=2.8,<3", "twine>=6,<7",
  "packaging>=24.2",
]

[project.scripts]
garmin-sync = "garmin_local_sync.cli:main"
garmin-sync-backfill = "garmin_local_sync.backfill:main"
garmin-sync-example = "garmin_local_sync.example:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src/garmin_local_sync"]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["osgeo.*", "fitdecode.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["garmin_local_sync"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
