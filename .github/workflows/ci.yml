name: checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install matching system GDAL and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gdal python3-venv
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Python quality, package and geographic checks
        run: .venv/bin/python scripts/check_quality.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-reports
          path: reports/quality/
